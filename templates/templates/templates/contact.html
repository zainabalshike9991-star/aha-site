<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <title>الدعم الفني</title>
</head>
<body>
    <main class="container">
        <section class="panel">
            <h2>💬 الدعم الفني</h2>
            <p>أرسل استفسارك وسنتابع معك عبر محادثة خاصة.</p>
            <form method="post" action="/contact">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label>الاسم:<input name="name" required maxlength="150"></label>
                <label>البريد الإلكتروني:<input type="email" name="email" required maxlength="200"></label>
                <label>رسالتك:<textarea name="body" required maxlength="3000" rows="5"></textarea></label>
                <button class="submit">إرسال الرسالة</button>
            </form>
            <div style="margin-top: 20px; text-align: center;">
                <a href="/">العودة للرئيسية</a>
            </div>
        </section>
    </main>
    <script src="/static/lang.js"></script>
</body>
</html>
